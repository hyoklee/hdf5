name: Linux Static-Only Build

# Test static-only library build with static tools and static executables
# Tests: HDF5_ONLY_SHARED_LIBS=OFF, BUILD_STATIC_LIBS=ON, BUILD_SHARED_LIBS=OFF,
#        HDF5_BUILD_STATIC_TOOLS=ON, BUILD_STATIC_EXECS=ON

on:
  workflow_dispatch:
  push:
    branches: develop-
  pull_request:
    branches: develop-

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: "Ubuntu Static-Only Build"
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build graphviz
          sudo apt install gcc-12 g++-12 gfortran-12
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV
          echo "FC=gfortran-12" >> $GITHUB_ENV

      - name: Install CMake
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure CMake
        run: |
          mkdir "${{ runner.workspace }}/build"
          cd "${{ runner.workspace }}/build"
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS:BOOL=OFF \
            -DBUILD_STATIC_LIBS:BOOL=ON \
            -DHDF5_ONLY_SHARED_LIBS:BOOL=OFF \
            -DHDF5_BUILD_STATIC_TOOLS:BOOL=ON \
            -DBUILD_STATIC_EXECS:BOOL=ON \
            -DHDF5_BUILD_CPP_LIB:BOOL=ON \
            -DHDF5_BUILD_FORTRAN:BOOL=ON \
            -DHDF5_BUILD_JAVA:BOOL=OFF \
            -DHDF5_BUILD_HL_LIB:BOOL=ON \
            -DHDF5_ENABLE_ZLIB_SUPPORT:BOOL=ON \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
            -DZLIB_USE_LOCALCONTENT:BOOL=OFF \
            -DLIBAEC_USE_LOCALCONTENT:BOOL=OFF \
            $GITHUB_WORKSPACE
        shell: bash

      - name: Build
        run: cmake --build . --config Release
        working-directory: ${{ runner.workspace }}/build

      - name: Test
        run: ctest --build-config Release --output-on-failure -j2
        working-directory: ${{ runner.workspace }}/build

      - name: Verify Static Executables
        run: |
          echo "Checking that executables are statically linked..."
          file bin/h5dump
          ldd bin/h5dump || echo "Static executable (no dynamic dependencies)"
        working-directory: ${{ runner.workspace }}/build
        shell: bash
