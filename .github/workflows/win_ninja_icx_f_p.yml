name: win ninja icx ifx p

on:
  push:
    branches:
      - develop-

permissions: read-all

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: cmake
        uses: lukka/get-cmake@4a7d025fc60f00db0c7b44ebf783d19b52444830 # latest
      - name: oneapi
        uses: awvwgk/setup-fortran@195bac823dc6e05bb7c706311ad4540ffc34d5b9 # main
        with:
          compiler: intel
          version: '2025.0'
      - name: mpi
        uses: mpi4py/setup-mpi@3417e34f1394a16723d7913c236642c24e95fd5a # master
        with:
          mpi: intelmpi
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: libaec
        run: |
          vcpkg install libaec
      - name: zlib
        run: |
          vcpkg install zlib
      - name: integrate
        run: |
          vcpkg integrate install
      - name: vars
        shell: cmd
        run: |
          "C:/Program Files (x86)/Intel/oneAPI/mpi/latest/env/vars.bat"
      - name: test
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DHDF5_BUILD_FORTRAN:BOOL=ON -DHDF5_ENABLE_ZLIB_SUPPORT:BOOL=ON -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=ON -DHDF5_ENABLE_PARALLEL:BOOL=ON -DMPIEXEC_EXECUTABLE:FILEPATH="C:/Program Files (x86)/Intel/oneAPI/mpi/latest/bin/mpiexec.exe" -DMPI_C_HEADER_DIR:PATH="C:/Program Files (x86)/Intel/oneAPI/mpi/latest/include" -DCTEST_DROP_SITE_INIT=my.cdash.org -DSITE="win-22" -DBUILDNAME="hk/ninja/r/icx/f/ae+zl/p" ..
          # ctest -D Experimental -C Release
          ctest -T Build
          ctest -T Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
