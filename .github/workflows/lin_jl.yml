name: lin jl

on:
  push:
    branches:
      - develop-

permissions: read-all

jobs:
  julia:
    name: lin jl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          path: hdf5
      - name: Install HDF5
        run: |
          cd hdf5
          mkdir build
          cd build
          cmake -DCMAKE_INSTALL_PREFIX=/tmp ..
          make -j
          make install
          cd ..

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # latest
        with:
          version: '1.6'
          arch: 'x64'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: JuliaIO/HDF5.jl
          path: .

      - name: Generate LocalPreferences
        run: |
          echo '[HDF5]' >> LocalPreferences.toml
          echo 'libhdf5 = "/tmp/lib/libhdf5.so"' >> LocalPreferences.toml
          echo 'libhdf5_hl = "/tmp/lib/libhdf5_hl.so"' >> LocalPreferences.toml

      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # latest
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # latest
        env:
          JULIA_DEBUG: Main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
