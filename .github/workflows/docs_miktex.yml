name: doxygen gh-pages miktex

on:
  workflow_dispatch:
  push:
    branches: develop
  pull_request:
    branches: develop
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - 'doc/**'
      - 'release_docs/**'
      - 'ACKNOWLEDGEMENTS'
      - 'COPYING**'
      - '**.md'

# Using concurrency to cancel any in-progress job or run
concurrency:
  group: ${{ github.workflow }}-${{ github.sha || github.event.pull_request.number }}
  cancel-in-progress: true

permissions: read-all

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - name: Get Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Dependencies
        run: |
          curl -fsSL https://miktex.org/download/key | sudo tee /usr/share/keyrings/miktex-keyring.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/miktex-keyring.asc] https://miktex.org/download/ubuntu noble universe" | sudo tee /etc/apt/sources.list.d/miktex.list
          sudo apt update -y
          sudo apt install -y libunwind-dev
          sudo apt install -y graphviz
          sudo apt install -y --no-install-recommends doxygen
          sudo apt install -y cmake
          sudo apt install -y miktex
          sudo miktexsetup --shared=yes finish
          sudo initexmf --admin --mklinks --force
          sudo initexmf --admin --set-config-value [MPM]AutoInstall=1
          sudo mpm --admin --update-db
          sudo mpm --admin --update
          sudo initexmf --admin --update-fndb
          # User-level MiKTeX setup: lualatex runs as runner (non-admin).
          # miktexsetup finish may timeout connecting to the MiKTeX API; allow failure.
          miktexsetup finish || true
          initexmf --update-fndb
          initexmf --mklinks --force
          miktex packages update-package-database || true
          miktex packages update || true
          # Install all packages required for doxygen lualatex to the USER tree.
          # lualatex (running as runner) searches the user tree; admin-installed
          # packages are not visible to it, so we pre-install here to prevent
          # auto-install calls during compilation (which trigger the update-check nag).
          # mpm exits 0 even when a download stalls ("Sorry, but: Timeout was
          # reached"), so a failed install is silent here and only surfaces much
          # later as lualatex aborting in the preamble when it tries to
          # auto-install the missing package. Record what timed out and retry.
          MIKTEX_FAILED=""
          mpm_install() {
            local out
            out=$(mpm --install "$1" 2>&1) || true
            printf '%s\n' "$out"
            case "$out" in
              *"Timeout was reached"*|*"resolve host"*|*"Connection refused"*)
                MIKTEX_FAILED="$MIKTEX_FAILED $1" ;;
            esac
          }
          mpm_install xkeyval
          mpm_install adjustbox
          mpm_install luaotfload
          mpm_install lualibs
          mpm_install courier
          mpm_install wasy
          mpm_install latex-tools
          mpm_install infwarerr
          mpm_install float
          mpm_install xcolor
          mpm_install graphics-cfg
          mpm_install graphics-def
          mpm_install graphics
          mpm_install colortbl
          mpm_install multirow
          mpm_install hanging
          mpm_install iftex
          mpm_install fancyvrb
          mpm_install ltablex
          mpm_install caption
          mpm_install fancyhdr
          mpm_install geometry
          mpm_install hyperref
          mpm_install lmodern
          mpm_install makeidx
          mpm_install needspace
          mpm_install setspace
          mpm_install stmaryrd
          mpm_install tocloft
          mpm_install wasysym
          mpm_install url
          mpm_install etoolbox
          mpm_install amsmath
          mpm_install oberdiek
          # Adjustbox dependencies observed being auto-installed during lualatex
          mpm_install collectbox
          mpm_install ifoddpage
          mpm_install varwidth
          mpm_install stackengine
          mpm_install listofitems
          mpm_install amsfonts
          mpm_install enumitem
          # LaTeX3 backend and standard packages observed being auto-installed
          mpm_install l3backend
          mpm_install l3backend-dev
          mpm_install l3kernel
          mpm_install l3packages
          mpm_install mptopdf
          mpm_install epstopdf-pkg
          mpm_install miktex-latex
          # More packages observed being auto-installed during lualatex compilation
          mpm_install alphalph
          mpm_install bigintcalc
          mpm_install bitset
          mpm_install changepage
          mpm_install etoc
          mpm_install gettitlestring
          mpm_install helvetic
          mpm_install hycolor
          mpm_install intcalc
          mpm_install kvdefinekeys
          mpm_install kvoptions
          mpm_install kvsetkeys
          mpm_install ltxcmds
          mpm_install natbib
          mpm_install newunicodechar
          mpm_install pdfescape
          mpm_install pdftexcmds
          mpm_install psnfss
          mpm_install refcount
          mpm_install rerunfilecheck
          mpm_install stringenc
          mpm_install ulem
          mpm_install uniquecounter
          # Retry whatever timed out. A transient mirror stall must not be
          # allowed to leave a package missing.
          for attempt in 1 2 3; do
            [ -n "$MIKTEX_FAILED" ] || break
            echo "::warning::MiKTeX install timed out for:$MIKTEX_FAILED (retry $attempt)"
            MIKTEX_RETRY="$MIKTEX_FAILED"
            MIKTEX_FAILED=""
            sleep 15
            for pkg in $MIKTEX_RETRY; do mpm_install "$pkg"; done
          done
          if [ -n "$MIKTEX_FAILED" ]; then
            echo "::error::MiKTeX packages could not be installed:$MIKTEX_FAILED"
            exit 1
          fi
          # Update user FNDB after all user-level package installations
          initexmf --update-fndb
          # mpm can report success without the file landing in a tree lualatex
          # searches, so confirm the styles the doxygen preamble loads are
          # actually resolvable before spending ten minutes on the build.
          MIKTEX_MISSING=""
          for sty in geometry.sty ltablex.sty hyperref.sty adjustbox.sty \
                     enumitem.sty expl3.sty refcount.sty hycolor.sty \
                     bigintcalc.sty; do
            kpsewhich "$sty" >/dev/null 2>&1 || MIKTEX_MISSING="$MIKTEX_MISSING $sty"
          done
          if [ -n "$MIKTEX_MISSING" ]; then
            echo "::error::MiKTeX styles missing after install:$MIKTEX_MISSING"
            exit 1
          fi
          # Set LastUserUpdateCheck to 24 hours in the future so that any
          # remaining auto-installs during lualatex cannot set a newer
          # LastUserUpdateDb and trigger the "not checked for updates" nag.
          TS=$(($(date +%s) + 86400))
          initexmf --set-config-value "[MPM]AutoInstall=1"
          initexmf --set-config-value "[MPM]LastUserUpdateCheck=${TS}"
          initexmf --set-config-value "[MPM]LastUserUpdateDb=${TS}"
          initexmf --set-config-value "[MPM]LastUserUpdate=${TS}"
          miktex packages check-update || true
          echo "=== miktex.ini after user setup ===" && cat ~/.miktex/texmfs/config/miktex/config/miktex.ini 2>/dev/null || echo "Config not found"
      - name: Build Develop Documentation
        run: |
          mkdir build
          cd build
          cmake -DHDF5_BUILD_DOC:BOOL=ON ..
          make doxygen
          pwd
          ls -l hdf5lib_docs

          # Fix doxygen.sty (replace unmaintained tabu/longtabu with ltablex)
          # and remove blank lines inside tabular environments in generated .tex files.
          # Both fixes are required for successful LaTeX compilation with MiKTeX.
          python3 ${GITHUB_WORKSPACE}/docs/doxygen/fix_latex_for_miktex.py hdf5lib_docs/latex

          cd hdf5lib_docs/html
          touch .nojekyll
          cd ../latex
          echo "=== miktex.ini before lualatex ===" && cat ~/.miktex/texmfs/config/miktex/config/miktex.ini 2>/dev/null || echo "NOT FOUND"
          # Re-stamp LastUserUpdateCheck to 24 hours in the future right before
          # lualatex runs. Each auto-install during compilation updates LastUserUpdateDb
          # to the current time; keeping LastUserUpdateCheck ahead prevents the
          # "not checked for MiKTeX updates" nag from firing during compilation.
          TS_BUILD=$(($(date +%s) + 86400))
          initexmf --set-config-value "[MPM]LastUserUpdateCheck=${TS_BUILD}"
          initexmf --set-config-value "[MPM]LastUserUpdateDb=${TS_BUILD}"
          # Use lualatex: dynamic memory allocation avoids the fixed 5MB limit
          # of pdflatex which is insufficient for this 4000+ page document.
          echo "=== array.sty version ===" && grep "ProvidesPackage\|fileversion\|filedate" $(kpsewhich array.sty) 2>/dev/null | head -5 || true
          echo "=== longtable.sty version ===" && grep "ProvidesPackage\|fileversion\|filedate" $(kpsewhich longtable.sty) 2>/dev/null | head -5 || true
          echo "=== insert@pcolumn in array.sty ===" && grep -n "insert@pcolumn" $(kpsewhich array.sty) 2>/dev/null || echo "not found"	  
          # Use lualatex: dynamic memory allocation avoids the fixed 5MB limit
          # of pdflatex which is insufficient for this 4000+ page document.
          # The diagnostics below used to live in a `|| ( ... )` subshell, where
          # `set -e` aborted at the first missing file: when lualatex dies before
          # writing refman.log, `tail` failed and MiKTeX's own log - the only
          # place the real error appears - was never printed.
          if ! make LATEX_CMD=lualatex; then
            echo "=== refman.log (last 200 lines) ==="
            tail -200 refman.log 2>/dev/null || echo "(refman.log was not written)"
            echo "=== MiKTeX lualatex.log ==="
            cat ~/.miktex/texmfs/data/miktex/log/lualatex.log 2>/dev/null || echo "(no MiKTeX lualatex.log)"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refman.pdf
          path: ${{ runner.workspace }}/hdf5/build/hdf5lib_docs/latex/refman.pdf
