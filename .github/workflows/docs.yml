name: doxygen gh-pages pdf

on:
  workflow_dispatch:
  push:
     branches: develop
  pull_request:
    branches: develop
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - 'doc/**'
      - 'release_docs/**'
      - 'ACKNOWLEDGEMENTS'
      - 'COPYING**'
      - '**.md'

# Using concurrency to cancel any in-progress job or run
concurrency:
  group: ${{ github.workflow }}-${{ github.sha || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write # In order to publish docs to the gh-pages branch
      pages: write
      id-token: write
    steps:
      - name: Get Sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libunwind-dev
          sudo apt install -y graphviz
          sudo apt install -y --no-install-recommends doxygen
          sudo apt install -y cmake
          sudo apt install -y texlive-full
          sudo apt install -y texlive-fonts-extra
          sudo apt install -y texlive-latex-extra

      - name: Build Develop Documentation
        run: |
          mkdir build
          cd build
          cmake -DHDF5_BUILD_DOC:BOOL=ON ..
          make doxygen
          pwd
          ls -l hdf5lib_docs
          cd hdf5lib_docs/html
          touch .nojekyll
          cd ../latex
          touch topics.tex annotated.tex files.tex
          # Fix tabu/longtabu → ltablex+longtable to avoid "! Missing \endcsname
          # inserted" with hyperref (tabu is unmaintained and buggy with hyperref)
          python3 ${GITHUB_WORKSPACE}/docs/doxygen/fix_latex_for_miktex.py .
          printf 'extra_mem_top = 50000000\nextra_mem_bot = 50000000\n' > /tmp/texmf.cnf
          TEXMFCNF=/tmp: make

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refman.pdf
          path: ${{ runner.workspace }}/hdf5/build/hdf5lib_docs/latex/refman.pdf

      - name: Deploy Develop
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          publish_dir: /home/runner/work/hdf5/hdf5/build/hdf5lib_docs/html
          destination_dir: develop
          github_token: ${{ secrets.GITHUB_TOKEN }}

