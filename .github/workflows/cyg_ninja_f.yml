name: cyg ninja f

on:
  push:
    branches:
      - develop-

permissions: read-all

jobs:
  test:
    name: cyg ninja
    runs-on: windows-latest
    steps:
      - name: git
        run: |
          git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: set
        uses: cygwin/cygwin-install-action@a3d72946b163026bbd0fa9a88379ccbda4bd86bb # master
        with:
          packages: cmake gcc-fortran make ninja perl zlib-devel
      - name: test
        run: |
          export PATH=/usr/bin:$PATH
          mkdir build
          cd build
          cmake -G Ninja \
           -D SITE:STRING=cwin \
           -DBUILDNAME:STRING="ninja/f" \
           -DBUILD_SHARED_LIBS:BOOL=OFF \
           -DHDF5_BUILD_FORTRAN:BOOL=ON \
           -D CTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
           ..
          # ctest -D Experimental
          ctest -T Build
          ctest -T Test
        shell: C:\cygwin\bin\bash.exe -eo pipefail -o igncr '{0}'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
