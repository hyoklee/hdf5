name: win 2025

on:
  push:
    branches: develop

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: libaec
        run: |
          vcpkg install libaec
      - name: zlib
        run: |
          vcpkg install zlib      
      - name: test
        run: |
          mkdir build
          cd build
          set libaec_ROOT="C:/vcpkg/packages/libaec_x64-windows"
          set
          dir "C:/vcpkg/packages/libaec_x64-windows"
          cmake -G "Visual Studio 17 2022" -A x64 -DSITE:STRING="win-25" -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DBUILDNAME:STRING="vcpkg/r+zl+sz" -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" -DCTEST_DROP_LOCATION_INIT="/submit.php?project=HDF5"  ..
          ctest -D Experimental -C Release
        shell: cmd
