name: arm64 lin

on:
  push:
    branches: develop-
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: test
        run: |
          mkdir build
          cd build
          cmake -DSITE:STRING="ubu.arm64" -DBUILDNAME:STRING="r" -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" -DCTEST_DROP_LOCATION_INIT:STRING="/submit.php?project=HDF5" ..
          # ctest -D Experimental -C Release
          ctest -T Build
          ctest -T Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
