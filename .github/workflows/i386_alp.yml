name: i386 alp

on:
  push:
    branches:
      - develop-

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: setup alpine
        uses: jirutka/setup-alpine@ae3b3ddba35054804fc4a3507b519fa7e8152050 # v1
        with:
          arch: x86
          packages: >
            build-base
            libgit2-dev
            cmake
      - name: run script
        run: |
          mkdir build
          cd build
          cmake -DSITE:STRING=alp.i386 -DBUILDNAME:STRING="r" -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" -DCTEST_DROP_LOCATION_INIT="/submit.php?project=HDF5" ..
          # ctest -D Experimental -C Release
          ctest -T Build
          ctest -T Test
        shell: alpine.sh --root {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
