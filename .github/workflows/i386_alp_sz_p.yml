name: i386 alp sz p

on:
  push:
    branches:
      - develop-

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: setup alpine
        uses: jirutka/setup-alpine@ae3b3ddba35054804fc4a3507b519fa7e8152050 # v1
        with:
          arch: x86
          packages: >
            build-base
            cmake
            curl
            libgit2-dev
            libaec-dev
            zlib-dev
            openmpi-dev
            openssh-client
      - name: run script
        run: |
          cat /etc/os-release
          export CMAKE_PREFIX_PATH=/usr/lib/cmake:$CMAKE_PREFIX_PATH
          export LDFLAGS="-L/usr/lib -lsz"
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          mkdir build
          cd build
          cmake -DSITE:STRING=alp.i386 -DBUILDNAME:STRING="hk/r-st/sz/p" -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" -DCTEST_DROP_LOCATION_INIT="/submit.php?project=HDF5" -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=ON -DBUILD_STATIC_LIBS:BOOL=OFF -DHDF5_ENABLE_PARALLEL=ON ..
          # ctest -D Experimental -C Release
          ctest -T Build
          ctest -T Test
        shell: alpine.sh --root {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
