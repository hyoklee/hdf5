name: mac ios

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions: read-all

jobs:
  build:
    name: mac ios
    runs-on: macos-latest
    steps:
    - name: install
      run: brew install ninja
    - name: get
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: configure
      run: |
        mkdir "${RUNNER_WORKSPACE}/build"
        cd "${RUNNER_WORKSPACE}/build"
        cmake \
        -GXcode \
        -DCMAKE_SYSTEM_NAME=iOS \
        "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
        -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
        -DCMAKE_INSTALL_PREFIX=`pwd`/_install \
        -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO \
        -DCMAKE_IOS_INSTALL_COMBINED=YES \
        -DBUILD_SHARED_LIBS:BOOL=ON \
        -DBUILD_STATIC_EXECS:BOOL=OFF \
        -DBUILD_STATIC_LIBS:BOOL=OFF \
        -DBUILD_SZIP_WITH_FETCHCONTENT:BOOL=OFF \
        -DBUILD_TESTING:BOOL=OFF \
        -DBUILD_USER_DEFINED_LIBS:BOOL=OFF \
        -DBUILD_ZLIB_WITH_FETCHCONTENT:BOOL=OFF \
        -DHDF5_BATCH_H5DETECT:BOOL=OFF \
        -DHDF5_BUILD_CPP_LIB:BOOL=OFF \
        -DHDF5_BUILD_DOC:BOOL=OFF \
        -DHDF5_BUILD_EXAMPLES:BOOL=OFF \
        -DHDF5_BUILD_FORTRAN:BOOL=OFF \
        -DHDF5_BUILD_FRAMEWORKS:BOOL=OFF \
        -DHDF5_BUILD_GENERATORS:BOOL=OFF \
        -DHDF5_BUILD_HL_GIF_TOOLS:BOOL=OFF \
        -DHDF5_BUILD_HL_LIB:BOOL=OFF \
        -DHDF5_BUILD_JAVA:BOOL=OFF \
        -DHDF5_BUILD_PARALLEL_TOOLS:BOOL=OFF \
        -DHDF5_BUILD_TOOLS:BOOL=ON \
        -DHDF5_BUILD_UTILS:BOOL=OFF \
        -DHDF5_BUILD_WITH_INSTALL_NAME:BOOL=OFF \
        -DHDF5_DIMENSION_SCALES_NEW_REF:BOOL=OFF \
        -DHDF5_DISABLE_COMPILER_WARNINGS:BOOL=OFF \
        -DHDF5_ENABLE_ALL_WARNINGS:BOOL=OFF \
        -DHDF5_ENABLE_COVERAGE:BOOL=OFF \
        -DHDF5_ENABLE_DEBUG_APIS:BOOL=OFF \
        -DHDF5_ENABLE_DEPRECATED_SYMBOLS=ON \
        -DHDF5_ENABLE_DEV_WARNINGS=OFF \
        -DHDF5_ENABLE_DIRECT_VFD=OFF \
        -DHDF5_ENABLE_EMBEDDED_LIBINFO=OFF \
        -DHDF5_ENABLE_HDFS=OFF \
        -DHDF5_ENABLE_MAP_API=OFF \
        -DHDF5_ENABLE_MIRROR_VFD=OFF \
        -DHDF5_ENABLE_PARALLEL:BOOL=OFF \
        -DHDF5_ENABLE_PLUGIN_SUPPORT:BOOL=OFF \
        -DHDF5_ENABLE_ROS3_VFD:BOOL=OFF \
        -DHDF5_ENABLE_SUBFILING_VFD:BOOL=OFF \
        -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
        -DHDF5_ENABLE_THREADSAFE:BOOL=OFF \
        -DHDF5_ENABLE_USING_MEMCHECKER:BOOL=OFF \
        -DHDF5_ENABLE_WARNINGS_AS_ERRORS:BOOL=OFF \
        -DHDF5_ENABLE_Z_LIB_SUPPORT:BOOL=OFF \
        -DHDF5_GENERATE_HEADERS:BOOL=ON \
        -DHDF5_IGNORE_DISABLED_FILE_LOCK:BOOL=OFF \
        -DHDF5_MINGW_STATIC_GCC_LIBS:BOOL=OFF \
        -DHDF5_MSVC_NAMING_CONVENTION:BOOL=OFF \
        -DHDF5_PACKAGE_EXTLIBS:BOOL=OFF \
        -DHDF5_PACK_EXAMPLES:BOOL=OFF \
        -DHDF5_PACK_MACOSX_FRAMEWORK:BOOL=OFF \
        -DHDF5_USE_FILE_LOCKING:BOOL=OFF \
        -DHDF5_USE_GNU_DIRS:BOOL=OFF \
        -DHDF5_USE_PREGEN:BOOL=OFF \
        -DSZIP_USE_EXTERNAL:BOOL=OFF \
        -DTEST_SHELL_SCRIPTS:BOOL=OFF \
        -DUSE_LIBAEC_STATIC:BOOL=OFF \
        -DZLIB_USE_EXTERNAL:BOOL=OFF \
        $GITHUB_WORKSPACE
      shell: bash
      env:
        RUNNER_WORKSPACE: ${{ runner.workspace }}

    - name: build
      run: cmake --build .
      working-directory: ${{ runner.workspace }}/build

    # iOS binaries cannot run on the macOS host, so verify the install instead.
    - name: install
      run: |
        cmake --install . --config Debug
        file _install/lib/libhdf5*.dylib _install/bin/h5dump
        otool -l _install/lib/libhdf5.dylib | grep -A4 LC_BUILD_VERSION
      working-directory: ${{ runner.workspace }}/build

  # Build for the iOS Simulator with tests and run them.
  simulator:
    name: mac ios simulator
    runs-on: macos-latest
    steps:
    - name: install
      run: brew install ninja
    - name: get
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: boot simulator
      run: |
        python3 - >> "$GITHUB_ENV" <<'EOF'
        import json, subprocess
        def simctl(*a):
            return json.loads(subprocess.check_output(["xcrun", "simctl", "list", *a, "-j"]))
        roots = {r["identifier"]: r.get("runtimeRoot", "") for r in simctl("runtimes")["runtimes"]}
        devices = simctl("devices", "available")["devices"]
        for runtime in sorted((r for r in devices if ".iOS-" in r), reverse=True):
            phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
            if phones and roots.get(runtime):
                print(f"SIMRUN_DEVICE={phones[0]['udid']}")
                print(f"SIM_RUNTIME_ROOT={roots[runtime]}")
                break
        else:
            raise SystemExit("no iPhone simulator available")
        EOF
        echo "BUILD_DIR=$RUNNER_WORKSPACE/simbuild" >> "$GITHUB_ENV"
        cat "$GITHUB_ENV"
        # Runtime paths can contain spaces, so read the UDID back instead of sourcing
        udid=$(sed -n 's/^SIMRUN_DEVICE=//p' "$GITHUB_ENV")
        xcrun simctl boot "$udid"
        xcrun simctl bootstatus "$udid"

    - name: build simlaunch
      run: |
        mkdir -p "$BUILD_DIR"
        xcrun -sdk iphonesimulator clang -O2 -target "$(uname -m)-apple-ios16.0-simulator" \
          config/ios/simlaunch.c -o "$BUILD_DIR/simlaunch"
        echo "SIMLAUNCH=$BUILD_DIR/simlaunch" >> "$GITHUB_ENV"

    - name: configure
      run: |
        cd "$BUILD_DIR"
        cmake -G Ninja \
        -DCMAKE_SYSTEM_NAME=iOS \
        -DCMAKE_OSX_SYSROOT=iphonesimulator \
        -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" \
        -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
        -DCMAKE_BUILD_TYPE=Debug \
        -DCMAKE_CROSSCOMPILING_EMULATOR="$GITHUB_WORKSPACE/config/ios/simrun.sh" \
        -DBUILD_SHARED_LIBS:BOOL=ON \
        -DBUILD_STATIC_LIBS:BOOL=OFF \
        -DBUILD_TESTING:BOOL=ON \
        -DHDF5_BUILD_TOOLS:BOOL=ON \
        -DHDF5_BUILD_UTILS:BOOL=OFF \
        -DHDF5_BUILD_CPP_LIB:BOOL=OFF \
        -DHDF5_BUILD_FORTRAN:BOOL=OFF \
        -DHDF5_BUILD_JAVA:BOOL=OFF \
        -DHDF5_BUILD_HL_LIB:BOOL=OFF \
        -DHDF5_BUILD_EXAMPLES:BOOL=OFF \
        -DHDF5_BUILD_DOC:BOOL=OFF \
        -DHDF5_ENABLE_ZLIB_SUPPORT:BOOL=OFF \
        -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
        -DHDF5_ENABLE_PLUGIN_SUPPORT:BOOL=OFF \
        -DHDF5_ENABLE_SUBFILING_VFD:BOOL=OFF \
        -DHDF5_USE_FILE_LOCKING:BOOL=OFF \
        -DTEST_SHELL_SCRIPTS:BOOL=OFF \
        "$GITHUB_WORKSPACE"

    - name: build
      run: cmake --build .
      working-directory: ${{ env.BUILD_DIR }}

    # Run a few test programs inside the booted simulator.
    - name: test in simulator
      run: |
        for t in lheap dtypes rtree; do
          echo "::group::$t"
          "$GITHUB_WORKSPACE/config/ios/simrun.sh" "$BUILD_DIR/bin/$t"
          echo "::endgroup::"
        done
      working-directory: ${{ env.BUILD_DIR }}/test/H5TEST

    # Most HDF5 tests do not use CMAKE_CROSSCOMPILING_EMULATOR yet, so run
    # the full suite on the host against the simulator's iOS runtime.
    - name: test
      run: DYLD_ROOT_PATH="$SIM_RUNTIME_ROOT" ctest --timeout 1200 --output-on-failure -j "$(sysctl -n hw.ncpu)"
      working-directory: ${{ env.BUILD_DIR }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
