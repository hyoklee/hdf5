name: mac-15 ninja ompi cl-21.1.0 h sf tv

on:
  push:
    branches: develop

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: install
        run: |
          brew update
          brew install flang
      - name: checkout
        uses: actions/checkout@v4
        with:
          repository: HDFGroup/hdf5
      - name: Get OpenMPI source
        uses: actions/checkout@v4
        with:
          repository: 'open-mpi/ompi'
          path: 'ompi'
          submodules: recursive
      - name: test
        run: |
          cmake --version
          ls /opt/homebrew/bin/flang*
          export FC=/opt/homebrew/bin/flang-21
          export CC=/opt/homebrew/Cellar/llvm/21.1.0/bin/clang
          export CXX=/opt/homebrew/Cellar/llvm/21.1.0/bin/clang++
          cd ompi
          ./autogen.pl
          ./configure
          make -j
          sudo make install
          cd ..
          mkdir build
          cd build
          cmake -G Ninja \
            -DSITE:STRING=mac-15 \
            -DBUILDNAME:STRING="hk/ninja/ompi/cl-21/j/h/sf/tv" \
            -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
            -DCTEST_DROP_LOCATION_INIT="/submit.php?project=HDF5" \
            -DHDF5_BUILD_FORTRAN=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=config/toolchain/clang.cmake \
            -DHDF5_BUILD_CPP_LIB:BOOL=OFF \
            -DHDF5_BUILD_HL_LIB:BOOL=ON \
            -DHDF5_BUILD_JAVA=ON \
            -DHDF5_BUILD_PARALLEL_TOOLS:BOOL=OFF \
            -DHDF5_ENABLE_ALL_WARNINGS=ON \
            -DHDF5_ENABLE_PARALLEL:BOOL=ON \
            -DHDF5_ENABLE_THREADSAFE:BOOL=OFF \
            -DHDF5_ENABLE_SUBFILING_VFD:BOOL=ON \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
            -DHDF5_TEST_VFD:BOOL=ON \
            -DMPIEXEC_MAX_NUMPROCS:STRING=3  \
            ..
          ctest -D Experimental
