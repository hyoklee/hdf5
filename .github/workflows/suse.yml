name: suse f cpp hl

on:
  push:
    branches: develop-

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    container: "opensuse/tumbleweed:latest@sha256:cf3c3245b02c66676bc3700319c326ba8f66a6d169484eeb88b2a6bf546dd63a"
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install
        run: |
          zypper up -y
          zypper in -y \
              file gcc-c++ gcc-fortran git \
              make patch unzip which tree \
              cmake bison zlib-devel
      - name: test
        run: |
          mkdir build && cd build && cmake -DSITE:STRING="sus-t" \
          -DBUILDNAME:STRING="hk/f+cpp/hl/gnu" \
          -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
          -DCTEST_DROP_LOCATION_INIT:STRING="/submit.php?project=HDF5" \
          -DHDF5_BUILD_FORTRAN=ON \
          -DHDF5_BUILD_HL_LIB=ON \
          -DHDF5_BUILD_CPP_LIB:BOOL=True \
          -DHDF5_USE_GNU_DIRS:BOOL=ON \
          ..
          ctest -T Build
          ctest -C Release -T Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
