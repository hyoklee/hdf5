name: mac-15 flang

on:
  push:
    branches: develop
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: install
        run: |
          brew update
          brew install flang
      - name: checkout
        uses: actions/checkout@v5.0.0
      - name: test
        run: |
          ls /opt/homebrew/bin/flang*
          export FC=/opt/homebrew/bin/flang-20
          export CC=/opt/homebrew/Cellar/llvm/20.1.2/bin/clang
          export CXX=/opt/homebrew/Cellar/llvm/20.1.2/bin/clang++
          mkdir build
          cd build
          cmake -G Ninja \
            -DSITE:STRING=mac-15 \
            -DBUILDNAME:STRING="hk/fl" \
            -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
            -DCTEST_DROP_LOCATION_INIT="/submit.php?project=HDF5" \
            -DHDF5_BUILD_FORTRAN=ON \
            ..
          # ctest -D Experimental
          ctest -T Build
          ctest -T Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
