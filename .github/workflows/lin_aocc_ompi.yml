name: lin aocc ompi

on:
  push:
    branches:
      - develop-

permissions: read-all

jobs:
  aocc_build_and_test:
    name: "aocc ${{ inputs.build_mode }}"
    runs-on: ubuntu-latest
    steps:
      - name: Get Sources
        uses: actions/checkout@v6

      - name: Install Dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y libaec-dev ninja-build
          sudo apt install -y doxygen libncurses-dev libquadmath0 libstdc++6 libxml2
          sudo apt install -y zlib1g-dev libcurl4-openssl-dev libjpeg-dev wget curl bzip2
          sudo apt install -y m4 flex bison cmake libzip-dev openssl build-essential

      - name: Install AOCC 5.1.0
        shell: bash
        run: |
          wget https://download.amd.com/developer/eula/aocc/aocc-5-1/aocc-compiler-5.1.0.tar
          tar -xvf aocc-compiler-5.1.0.tar
          cd aocc-compiler-5.1.0
          bash install.sh
          source /home/runner/work/hdf5/hdf5/setenv_AOCC.sh
          which clang
          which flang
          clang -v

      - name: Cache OpenMPI 5.0.9 installation
        id: cache-openmpi-5_0_9
        uses: actions/cache@v5
        with:
          path: /home/runner/work/hdf5/hdf5/openmpi-5.0.9-install
          key: ${{ runner.os }}-${{ runner.arch }}-openmpi-5_0_9-cache

      - name: Install OpenMPI 5.0.9
        if: ${{ steps.cache-openmpi-5_0_9.outputs.cache-hit != 'true' }}
        run: |
          export LD_LIBRARY_PATH=/home/runner/work/hdf5/hdf5/aocc-compiler-5.1.0/lib:/usr/local/lib
          wget https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.9.tar.gz
          tar zxvf openmpi-5.0.9.tar.gz
          cd openmpi-5.0.9
          ./configure CC=/home/runner/work/hdf5/hdf5/aocc-compiler-5.1.0/bin/clang FC=/home/runner/work/hdf5/hdf5/aocc-compiler-5.1.0/bin/flang --prefix=/home/runner/work/hdf5/hdf5/openmpi-5.0.9-install
          make
          make install

      - name: CMake Configure
        shell: bash
        run: |
          export LD_LIBRARY_PATH=/home/runner/work/hdf5/hdf5/aocc-compiler-5.1.0/lib:/home/runner/work/hdf5/hdf5/openmpi-5.0.9-install/lib:/usr/local/lib
          export LD_RUN_PATH=/home/runner/work/hdf5/hdf5/aocc-compiler-5.1.0/lib:/home/runner/work/hdf5/hdf5/openmpi-5.0.9-install/lib:/usr/local/lib
          export PATH=/home/runner/work/hdf5/hdf5/openmpi-5.0.9-install/bin:/usr/local/bin:$PATH
          mkdir build
          cd build
          CC=mpicc cmake -C $GITHUB_WORKSPACE/config/cmake/cacheinit.cmake -G Ninja \
          -DBUILDNAME:STRING="ninja+r/aocc-5.1.0/ompi-5.0.9" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
          -DHDF5_BUILD_FORTRAN:BOOL=OFF \
          -DHDF5_BUILD_JAVA:BOOL=OFF \
          -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
          -DHDF5_ENABLE_PARALLEL:BOOL=ON \
          -DHDF5_ENABLE_SUBFILING_VFD:BOOL=OFF \
          -DHDF5_BUILD_CPP_LIB:BOOL=OFF \
          -DLIBAEC_USE_LOCALCONTENT=OFF \
          -DMPIEXEC_MAX_NUMPROCS:STRING="2" \
          -DZLIB_USE_LOCALCONTENT=OFF \
          -DSITE:STRING=ubu \
          ..
          # ctest -D Experimental
          ctest -T Build
          ctest -T Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
