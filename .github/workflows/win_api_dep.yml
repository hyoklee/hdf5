name: Windows API Versions & Deprecated

# Test Windows builds with different API versions and deprecated symbols
# Tests: HDF5_DEFAULT_API_VERSION (v18, v110, v112, v114), HDF5_ENABLE_DEPRECATED_SYMBOLS

on:
  workflow_dispatch:
  push:
    branches: [ develop-, feature/**, bugfix/** ]
  pull_request:
    branches: [ develop- ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  api_v18:
    name: "Windows API v1.8"
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
      - name: Install Dependencies
        run: choco install ninja

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          mkdir "${{ runner.workspace }}/build"
          cd "${{ runner.workspace }}/build"
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DHDF5_DEFAULT_API_VERSION:STRING=v18 `
            -DBUILD_SHARED_LIBS:BOOL=ON `
            -DHDF5_BUILD_CPP_LIB:BOOL=ON `
            -DHDF5_BUILD_FORTRAN:BOOL=OFF `
            -DHDF5_BUILD_JAVA:BOOL=OFF `
            -DHDF5_BUILD_HL_LIB:BOOL=ON `
            -DHDF5_ENABLE_ZLIB_SUPPORT:BOOL=OFF `
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF `
            -DZLIB_USE_LOCALCONTENT:BOOL=OFF `
            -DLIBAEC_USE_LOCALCONTENT:BOOL=OFF `
            $env:GITHUB_WORKSPACE
        shell: pwsh

      - name: Build
        run: cmake --build . --config Release
        working-directory: ${{ runner.workspace }}/build

      - name: Test
        run: ctest --build-config Release --output-on-failure -j2
        working-directory: ${{ runner.workspace }}/build

  deprecated_off:
    name: "Windows Deprecated OFF"
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
      - name: Install Dependencies
        run: choco install ninja

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          mkdir "${{ runner.workspace }}/build"
          cd "${{ runner.workspace }}/build"
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DHDF5_ENABLE_DEPRECATED_SYMBOLS:BOOL=OFF `
            -DBUILD_SHARED_LIBS:BOOL=ON `
            -DHDF5_BUILD_CPP_LIB:BOOL=ON `
            -DHDF5_BUILD_FORTRAN:BOOL=OFF `
            -DHDF5_BUILD_JAVA:BOOL=OFF `
            -DHDF5_BUILD_HL_LIB:BOOL=ON `
            -DHDF5_ENABLE_ZLIB_SUPPORT:BOOL=OFF `
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF `
            -DZLIB_USE_LOCALCONTENT:BOOL=OFF `
            -DLIBAEC_USE_LOCALCONTENT:BOOL=OFF `
            $env:GITHUB_WORKSPACE
        shell: pwsh

      - name: Build
        run: cmake --build . --config Release
        working-directory: ${{ runner.workspace }}/build

      - name: Test
        run: ctest --build-config Release --output-on-failure -j2
        working-directory: ${{ runner.workspace }}/build
