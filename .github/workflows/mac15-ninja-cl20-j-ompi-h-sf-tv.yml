name: mac-15 ninja o4 j ompi h sf tv

on:
  push:
    branches: develop

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: install
        run: |
          brew update
          brew install openmpi flang
      - uses: lukka/get-cmake@latest
      - name: checkout
        uses: actions/checkout@v5
        with:
          repository: HDFGroup/hdf5
      - name: test
        run: |
          cmake --version
          ls /opt/homebrew/bin/flang*
          export FC=/opt/homebrew/bin/flang-20
          export CC=/opt/homebrew/Cellar/llvm/20.1.2/bin/clang
          export CXX=/opt/homebrew/Cellar/llvm/20.1.2/bin/clang++	  
          mkdir build
          cd build
          cmake -G Ninja \
            -DSITE:STRING=mac-15 \
            -DBUILDNAME:STRING="hk/ninja/cl-20/+j/+ompi+np=3/+h+sf+tv" \
            -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
            -DCTEST_DROP_LOCATION_INIT="/submit.php?project=HDF5" \
            -DHDF5_BUILD_FORTRAN=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=config/toolchain/clang.cmake \
            -DHDF5_BUILD_CPP_LIB:BOOL=OFF \
            -DHDF5_BUILD_HL_LIB:BOOL=ON \
            -DHDF5_BUILD_JAVA=ON \
            -DHDF5_BUILD_PARALLEL_TOOLS:BOOL=OFF \
            -DHDF5_ENABLE_ALL_WARNINGS=ON \
            -DHDF5_ENABLE_PARALLEL:BOOL=ON \
            -DHDF5_ENABLE_THREADSAFE:BOOL=OFF \
            -DHDF5_ENABLE_SUBFILING_VFD:BOOL=ON \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
            -DHDF5_TEST_VFD:BOOL=ON \
            -DMPIEXEC_MAX_NUMPROCS:STRING=3  \
            ..
          ctest -D Experimental
