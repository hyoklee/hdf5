name: win-25 ninja icx ifx p

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: cmake
        uses: lukka/get-cmake@latest
      - name: oneapi
        uses: awvwgk/setup-fortran@main
        with:
          compiler: intel
          version: '2025.0'
      - name: mpi
        uses: mpi4py/setup-mpi@master
        with:
          mpi: intelmpi
      - name: checkout
        uses: actions/checkout@v4.1.1
      - name: vars
        shell: cmd
        run: |
          "C:/Program Files (x86)/Intel/oneAPI/mpi/latest/env/vars.bat"
      - name: test
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DHDF5_BUILD_FORTRAN:BOOL=ON -DHDF5_ENABLE_PARALLEL:BOOL=ON -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF -DHDF5_ENABLE_Z_LIB_SUPPORT:BOOL=OFF -DMPIEXEC_EXECUTABLE:FILEPATH="C:\Program Files (x86)\Intel\oneAPI\mpi\2021.14\bin\mpiexec.exe" -DMPI_C_HEADER_DIR:PATH="C:\Program Files (x86)\Intel\oneAPI\mpi\2021.14\include" -DCTEST_DROP_SITE_INIT=my.cdash.org -DSITE="win-25" -DBUILDNAME="hk/ninja/icx/+f/+p" ..
          ctest -D Experimental -C Release	  
