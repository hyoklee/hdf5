name: ppc64le lin

on:
  push:
    branches:
      - develop-

jobs:
  ppc64le_job:
    name: ppc64le lin
    runs-on: ubuntu-latest

    steps:
      - name: Get Sources
        uses: actions/checkout@v6

      - name: Run
        uses: uraimo/run-on-arch-action@v3
        id: runcmd
        with:
          arch: ppc64le
          distro: ubuntu_latest
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y git cmake libjpeg-dev zlib1g zlib1g-dev
            apt-get install -q -y gfortran g++  yacc flex libtool autotools-dev
          run: |
            echo ::set-output name=uname::$(uname -a)
            mkdir build
            cd build
            cmake \
            -D CTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
            -D SITE:STRING=ppc64le \
            ..
            ctest -T Build
            ctest -C Release -T Test

      - name: Get the output
        # Echo the `uname` output parameter from the `runcmd` step
        run: |
          echo "The uname output was ${{ steps.runcmd.outputs.uname }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

