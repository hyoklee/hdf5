name: Linux Trace & Instrument

# Test building with tracing and instrumentation enabled
# Tests: HDF5_ENABLE_TRACE=ON, HDF5_ENABLE_INSTRUMENT=ON

on:
  workflow_dispatch:
  push:
    branches: [ develop-, feature/**, bugfix/** ]
  pull_request:
    branches: [ develop- ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: "Ubuntu Trace & Instrument"
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build
          sudo apt install gcc-12 g++-12 gfortran-12
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV
          echo "FC=gfortran-12" >> $GITHUB_ENV

      - name: Install CMake
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure CMake
        run: |
          mkdir "${{ runner.workspace }}/build"
          cd "${{ runner.workspace }}/build"
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHDF5_ENABLE_TRACE:BOOL=ON \
            -DHDF5_ENABLE_INSTRUMENT:BOOL=ON \
            -DBUILD_SHARED_LIBS:BOOL=ON \
            -DHDF5_BUILD_CPP_LIB:BOOL=OFF \
            -DHDF5_BUILD_FORTRAN:BOOL=OFF \
            -DHDF5_BUILD_JAVA:BOOL=OFF \
            -DHDF5_BUILD_HL_LIB:BOOL=ON \
            -DHDF5_ENABLE_ZLIB_SUPPORT:BOOL=ON \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
            -DZLIB_USE_LOCALCONTENT:BOOL=OFF \
            -DLIBAEC_USE_LOCALCONTENT:BOOL=OFF \
            $GITHUB_WORKSPACE
        shell: bash

      - name: Build
        run: cmake --build . --config Debug
        working-directory: ${{ runner.workspace }}/build

      - name: Test
        run: ctest --build-config Debug --output-on-failure -j2
        working-directory: ${{ runner.workspace }}/build
