name: Windows Static-Only Build

# Test static-only library build with static tools
# Tests: HDF5_ONLY_SHARED_LIBS=OFF, BUILD_STATIC_LIBS=ON, BUILD_SHARED_LIBS=OFF,
#        HDF5_BUILD_STATIC_TOOLS=ON

on:
  workflow_dispatch:
  push:
    branches: [ develop-, feature/**, bugfix/** ]
  pull_request:
    branches: [ develop- ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: "Windows MSVC Static-Only Build"
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
      - name: Install Dependencies
        run: choco install ninja

      - name: Install CMake
        uses: lukka/get-cmake@4a7d025fc60f00db0c7b44ebf783d19b52444830 # latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Set environment for MSVC
        run: |
          echo "CXX=cl.exe" >> $env:GITHUB_ENV
          echo "CC=cl.exe" >> $env:GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Configure CMake
        run: |
          mkdir "${{ runner.workspace }}/build"
          cd "${{ runner.workspace }}/build"
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS:BOOL=OFF `
            -DBUILD_STATIC_LIBS:BOOL=ON `
            -DHDF5_ONLY_SHARED_LIBS:BOOL=OFF `
            -DHDF5_BUILD_STATIC_TOOLS:BOOL=ON `
            -DHDF5_BUILD_CPP_LIB:BOOL=ON `
            -DHDF5_BUILD_FORTRAN:BOOL=OFF `
            -DHDF5_BUILD_JAVA:BOOL=OFF `
            -DHDF5_BUILD_HL_LIB:BOOL=ON `
            -DHDF5_ENABLE_ZLIB_SUPPORT:BOOL=OFF `
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF `
            -DZLIB_USE_LOCALCONTENT:BOOL=OFF `
            -DLIBAEC_USE_LOCALCONTENT:BOOL=OFF `
            $env:GITHUB_WORKSPACE
        shell: pwsh

      - name: Build
        run: cmake --build . --config Release
        working-directory: ${{ runner.workspace }}/build

      - name: Test
        run: ctest --build-config Release --output-on-failure -j2
        working-directory: ${{ runner.workspace }}/build
