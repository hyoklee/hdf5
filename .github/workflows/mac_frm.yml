name: macOS Frameworks Build

# Test building HDF5 as macOS frameworks
# Tests: HDF5_BUILD_FRAMEWORKS=ON

on:
  workflow_dispatch:
  push:
    branches: [ develop-, feature/**, bugfix/** ]
  pull_request:
    branches: [ develop- ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: "macOS Framework Build"
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
      - name: Install Dependencies
        run: brew install ninja

      - name: Install CMake
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure CMake
        run: |
          mkdir "${{ runner.workspace }}/build"
          cd "${{ runner.workspace }}/build"
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHDF5_BUILD_FRAMEWORKS:BOOL=ON \
            -DBUILD_SHARED_LIBS:BOOL=ON \
            -DHDF5_BUILD_CPP_LIB:BOOL=ON \
            -DHDF5_BUILD_FORTRAN:BOOL=OFF \
            -DHDF5_BUILD_JAVA:BOOL=OFF \
            -DHDF5_BUILD_HL_LIB:BOOL=ON \
            -DHDF5_ENABLE_ZLIB_SUPPORT:BOOL=ON \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
            -DZLIB_USE_LOCALCONTENT:BOOL=OFF \
            -DLIBAEC_USE_LOCALCONTENT:BOOL=OFF \
            $GITHUB_WORKSPACE
        shell: bash

      - name: Build
        run: cmake --build . --config Release
        working-directory: ${{ runner.workspace }}/build

      - name: Test
        run: ctest --build-config Release --output-on-failure -j2
        working-directory: ${{ runner.workspace }}/build

      - name: Verify Framework Structure
        run: |
          echo "Checking for framework structure..."
          find . -name "*.framework" -type d
        working-directory: ${{ runner.workspace }}/build
        shell: bash
