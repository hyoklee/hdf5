name: doxygen gh-pages miktex

on:
  workflow_dispatch:
  push:
    branches: develop
  pull_request:
    branches: develop
    paths-ignore:
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - 'doc/**'
      - 'release_docs/**'
      - 'ACKNOWLEDGEMENTS'
      - 'COPYING**'
      - '**.md'

# Using concurrency to cancel any in-progress job or run
concurrency:
  group: ${{ github.workflow }}-${{ github.sha || github.event.pull_request.number }}
  cancel-in-progress: true

permissions: read-all

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      - name: Get Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Dependencies
        run: |
          curl -fsSL https://miktex.org/download/key | sudo tee /usr/share/keyrings/miktex-keyring.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/miktex-keyring.asc] https://miktex.org/download/ubuntu noble universe" | sudo tee /etc/apt/sources.list.d/miktex.list
          sudo apt update -y
          sudo apt install -y libunwind-dev
          sudo apt install -y graphviz
          sudo apt install -y --no-install-recommends doxygen
          sudo apt install -y cmake
          sudo apt install -y miktex
          sudo miktexsetup --shared=yes finish
          sudo initexmf --admin --mklinks --force
          sudo initexmf --admin --set-config-value [MPM]AutoInstall=1
          sudo mpm --admin --update-db
          sudo mpm --admin --update
          sudo initexmf --admin --update-fndb
          # User-level MiKTeX setup: lualatex runs as runner (non-admin).
          # miktexsetup finish may timeout connecting to the MiKTeX API; allow failure.
          miktexsetup finish || true
          initexmf --update-fndb
          initexmf --mklinks --force
          miktex packages update-package-database || true
          miktex packages update || true

          # Install every package the doxygen lualatex run needs into the USER
          # tree. lualatex (running as runner) searches the user tree; packages
          # installed by the admin steps above are not visible to it, so
          # pre-installing here prevents auto-install calls during compilation
          # (which trigger the update-check nag).
          #
          # mpm exits 0 even when a mirror stalls mid-download, and it does not
          # reliably print a recognizable error either: an install that silently
          # did nothing used to be recorded as successful and only surfaced
          # later, as a missing .sty. So do not trust mpm's output at all -
          # verify each install by asking kpsewhich for a file the package must
          # provide, and drive the retries off that.
          #
          # Second column is the file to probe for, or "-" for the few packages
          # that ship no file under a stable, greppable name (their absence
          # shows up via the packages that depend on them).
          MIKTEX_PACKAGES="
          xkeyval xkeyval.sty
          adjustbox adjustbox.sty
          luaotfload luaotfload.sty
          lualibs lualibs.lua
          courier -
          wasy wasy10.tfm
          latex-tools array.sty
          infwarerr infwarerr.sty
          float float.sty
          xcolor xcolor.sty
          graphics-cfg graphics.cfg
          graphics-def -
          graphics graphicx.sty
          colortbl colortbl.sty
          multirow multirow.sty
          hanging hanging.sty
          iftex iftex.sty
          fancyvrb fancyvrb.sty
          ltablex ltablex.sty
          caption caption.sty
          fancyhdr fancyhdr.sty
          geometry geometry.sty
          hyperref hyperref.sty
          lm lmodern.sty
          ltxbase makeidx.sty
          needspace needspace.sty
          setspace setspace.sty
          stmaryrd stmaryrd.sty
          tocloft tocloft.sty
          wasysym wasysym.sty
          url url.sty
          etoolbox etoolbox.sty
          amsmath amsmath.sty
          oberdiek -
          collectbox collectbox.sty
          ifoddpage ifoddpage.sty
          varwidth varwidth.sty
          stackengine stackengine.sty
          listofitems listofitems.sty
          amsfonts amsfonts.sty
          enumitem enumitem.sty
          l3kernel expl3.sty
          l3packages xparse.sty
          mptopdf -
          epstopdf-pkg epstopdf-base.sty
          miktex-latex -
          alphalph alphalph.sty
          bigintcalc bigintcalc.sty
          bitset bitset.sty
          changepage changepage.sty
          etoc etoc.sty
          gettitlestring gettitlestring.sty
          helvetic -
          hycolor hycolor.sty
          intcalc intcalc.sty
          kvdefinekeys kvdefinekeys.sty
          kvoptions kvoptions.sty
          kvsetkeys kvsetkeys.sty
          ltxcmds ltxcmds.sty
          natbib natbib.sty
          newunicodechar newunicodechar.sty
          pdfescape pdfescape.sty
          pdftexcmds pdftexcmds.sty
          psnfss helvet.sty
          refcount refcount.sty
          rerunfilecheck rerunfilecheck.sty
          stringenc stringenc.sty
          ulem ulem.sty
          uniquecounter uniquecounter.sty
          "

          # Every odd field of a "pkg file pkg file ..." list, for log messages.
          pkg_names() {
            echo "$1" | awk '{ for (i = 1; i <= NF; i += 2) printf " %s", $i }'
          }

          # Installs the packages named in MIKTEX_MISSING ("pkg file pkg file
          # ...") and leaves in it the pairs whose file kpsewhich still cannot
          # resolve. Communicating through the variable rather than stdout keeps
          # mpm's own (very chatty) output out of the result.
          install_packages() {
            local pkg file still_missing=""
            set -- $MIKTEX_MISSING
            while [ "$#" -ge 2 ]; do
              pkg=$1
              file=$2
              shift 2
              if [ "$file" != "-" ] && kpsewhich "$file" >/dev/null 2>&1; then
                continue
              fi
              mpm --install "$pkg" 2>&1 | sed "s/^/[$pkg] /" || true
              [ "$file" != "-" ] || continue
              if ! kpsewhich "$file" >/dev/null 2>&1; then
                # A newly unpacked package may not be in the file name database
                # yet; rebuild it before concluding the install did not land.
                initexmf --update-fndb >/dev/null 2>&1 || true
                kpsewhich "$file" >/dev/null 2>&1 || still_missing="$still_missing $pkg $file"
              fi
            done
            MIKTEX_MISSING="$still_missing"
          }

          MIKTEX_MISSING="$MIKTEX_PACKAGES"
          install_packages
          for attempt in 1 2 3; do
            [ -n "$MIKTEX_MISSING" ] || break
            echo "::warning::MiKTeX packages missing after install:$(pkg_names "$MIKTEX_MISSING") (retry $attempt)"
            # Retrying against the mirror that just stalled changes nothing,
            # which is why previous runs failed the same packages three times
            # in a row. Pick a different repository before each retry.
            MIKTEX_REPO=$(mpm --pick-repository-url 2>/dev/null | tr -d '\r' | grep '^http' | tail -1)
            if [ -n "$MIKTEX_REPO" ]; then
              echo "Switching MiKTeX repository to $MIKTEX_REPO"
              mpm --set-repository="$MIKTEX_REPO" || true
              miktex packages update-package-database || true
            fi
            sleep 15
            install_packages
          done
          if [ -n "$MIKTEX_MISSING" ]; then
            echo "::error::MiKTeX packages could not be installed:$(pkg_names "$MIKTEX_MISSING")"
            exit 1
          fi

          # Update user FNDB after all user-level package installations
          initexmf --update-fndb
          # Set LastUserUpdateCheck to 24 hours in the future so that any
          # remaining auto-installs during lualatex cannot set a newer
          # LastUserUpdateDb and trigger the "not checked for updates" nag.
          TS=$(($(date +%s) + 86400))
          initexmf --set-config-value "[MPM]AutoInstall=1"
          initexmf --set-config-value "[MPM]LastUserUpdateCheck=${TS}"
          initexmf --set-config-value "[MPM]LastUserUpdateDb=${TS}"
          initexmf --set-config-value "[MPM]LastUserUpdate=${TS}"
          miktex packages check-update || true
          echo "=== miktex.ini after user setup ===" && cat ~/.miktex/texmfs/config/miktex/config/miktex.ini 2>/dev/null || echo "Config not found"
      - name: Build Develop Documentation
        run: |
          mkdir build
          cd build
          cmake -DHDF5_BUILD_DOC:BOOL=ON ..
          make doxygen
          pwd
          ls -l hdf5lib_docs

          # Fix doxygen.sty (replace unmaintained tabu/longtabu with ltablex)
          # and remove blank lines inside tabular environments in generated .tex files.
          # Both fixes are required for successful LaTeX compilation with MiKTeX.
          python3 ${GITHUB_WORKSPACE}/docs/doxygen/fix_latex_for_miktex.py hdf5lib_docs/latex

          cd hdf5lib_docs/html
          touch .nojekyll
          cd ../latex
          echo "=== miktex.ini before lualatex ===" && cat ~/.miktex/texmfs/config/miktex/config/miktex.ini 2>/dev/null || echo "NOT FOUND"
          # Re-stamp LastUserUpdateCheck to 24 hours in the future right before
          # lualatex runs. Each auto-install during compilation updates LastUserUpdateDb
          # to the current time; keeping LastUserUpdateCheck ahead prevents the
          # "not checked for MiKTeX updates" nag from firing during compilation.
          TS_BUILD=$(($(date +%s) + 86400))
          initexmf --set-config-value "[MPM]LastUserUpdateCheck=${TS_BUILD}"
          initexmf --set-config-value "[MPM]LastUserUpdateDb=${TS_BUILD}"
          # Use lualatex: dynamic memory allocation avoids the fixed 5MB limit
          # of pdflatex which is insufficient for this 4000+ page document.
          echo "=== array.sty version ===" && grep "ProvidesPackage\|fileversion\|filedate" $(kpsewhich array.sty) 2>/dev/null | head -5 || true
          echo "=== longtable.sty version ===" && grep "ProvidesPackage\|fileversion\|filedate" $(kpsewhich longtable.sty) 2>/dev/null | head -5 || true
          echo "=== insert@pcolumn in array.sty ===" && grep -n "insert@pcolumn" $(kpsewhich array.sty) 2>/dev/null || echo "not found"
          # The diagnostics below used to live in a `|| ( ... )` subshell, where
          # `set -e` aborted at the first missing file: when lualatex dies before
          # writing refman.log, `tail` failed and MiKTeX's own log - the only
          # place the real error appears - was never printed.
          if ! make LATEX_CMD=lualatex; then
            echo "=== refman.log (last 200 lines) ==="
            tail -200 refman.log 2>/dev/null || echo "(refman.log was not written)"
            echo "=== MiKTeX lualatex.log ==="
            cat ~/.miktex/texmfs/data/miktex/log/lualatex.log 2>/dev/null || echo "(no MiKTeX lualatex.log)"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: refman.pdf
          path: ${{ runner.workspace }}/hdf5/build/hdf5lib_docs/latex/refman.pdf
