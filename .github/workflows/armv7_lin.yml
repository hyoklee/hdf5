name: armv7 lin

on:
  push:
    branches:
      - develop-

permissions: read-all

jobs:
  armv7:
    # The host should always be Linux
    runs-on: ubuntu-latest
    name: Build on ubuntu-latest armv7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: uraimo/run-on-arch-action@fa1f3e7de95534497266c7265950b5188355fbfb # v3.2.1
        name: Run commands
        id: runcmd
        with:
          arch: armv7
          distro: ubuntu_latest

          install: |
            apt-get update -q -y
            apt-get install -q -y git
            apt-get install -q -y cmake
          run: |
            echo ::set-output name=uname::$(uname -a)
            mkdir build
            cd build
            cmake -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF ..
            make
            ctest --timeout 3000


      - name: Get the output
        # Echo the `uname` output parameter from the `runcmd` step
        run: |
          echo "The uname output was ${STEPS_RUNCMD_OUTPUTS_UNAME}"
        env:
          STEPS_RUNCMD_OUTPUTS_UNAME: ${{ steps.runcmd.outputs.uname }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
