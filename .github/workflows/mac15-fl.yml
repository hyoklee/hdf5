name: mac-15 flang

on:
  push:
    branches: develop

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: install
        run: |
          brew update
          brew info flang
          brew install flang
      - name: checkout
        uses: actions/checkout@v4
      - name: test
        run: |
          ls /opt/homebrew/bin/flang*
          export FC=/opt/homebrew/bin/flang-20
          mkdir build
          cd build
          cmake -G Ninja \
            -DSITE:STRING=mac-15 \
            -DBUILDNAME:STRING="hk/fl-sh" \
            -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
            -DCTEST_DROP_LOCATION_INIT="/submit.php?project=HDF5" \
            -DHDF5_BUILD_FORTRAN=ON \
            -DBUILD_SHARED_LIBS:BOOL=OFF \
            ..
          ctest -D Experimental
