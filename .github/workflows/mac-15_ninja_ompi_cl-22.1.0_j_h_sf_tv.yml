name: mac-15 ninja ompi cl-22.1.0 h sf tv

on:
  push:
    branches: develop-

permissions: read-all

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: install
        run: |
          brew update
          brew install autoconf automake flang libtool llvm
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: HDFGroup/hdf5
      - name: Get OpenMPI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: 'open-mpi/ompi'
          path: 'ompi'
          ref: 'v5.0.9'
          submodules: recursive
      - name: mpi
        run: |
          cmake --version
          find /opt/homebrew/Cellar/llvm/
          export FC=/opt/homebrew/bin/flang-22
          export CC=/opt/homebrew/Cellar/llvm/22.1.0/bin/clang-22
          export CXX=/opt/homebrew/Cellar/llvm/22.1.0/bin/clang++-22
          export LDFLAGS="-L/opt/homebrew/Cellar/llvm/22.1.0/lib -Wl,-rpath,/opt/homebrew/Cellar/llvm/22.1.0/lib"
          export CFLAGS=-I/opt/homebrew/Cellar/llvm/22.1.0/include
          export CPPFLAGS=-I/opt/homebrew/Cellar/llvm/22.1.0/include
          cd ompi
          ./autogen.pl
          ./configure  --enable-mca-no-build=btl-uct \
            --with-libevent=internal \
            --disable-getpwuid
          make -j 2
          sudo make install
      - name: h5
        run: |
          cat ompi/config.log
          export FC=/opt/homebrew/bin/flang-22
          export CC=/opt/homebrew/Cellar/llvm/22.1.0/bin/clang-22
          export LDFLAGS="-L/opt/homebrew/Cellar/llvm/22.1.0/lib -Wl,-rpath"
          export CFLAGS=-I/opt/homebrew/Cellar/llvm/22.1.0/include
          mkdir build
          cd build
          cmake -G Ninja \
            -DSITE:STRING=mac-15 \
            -DBUILDNAME:STRING="hk/ninja/ompi/cl-22/j/h/sf/tv" \
            -DCTEST_DROP_SITE_INIT:STRING="my.cdash.org" \
            -DCTEST_DROP_LOCATION_INIT="/submit.php?project=HDF5" \
            -DHDF5_BUILD_FORTRAN=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=config/toolchain/clang.cmake \
            -DHDF5_BUILD_CPP_LIB:BOOL=OFF \
            -DHDF5_BUILD_HL_LIB:BOOL=ON \
            -DHDF5_BUILD_JAVA=ON \
            -DHDF5_BUILD_PARALLEL_TOOLS:BOOL=OFF \
            -DHDF5_ENABLE_ALL_WARNINGS=ON \
            -DHDF5_ENABLE_PARALLEL:BOOL=ON \
            -DHDF5_ENABLE_THREADSAFE:BOOL=OFF \
            -DHDF5_ENABLE_SUBFILING_VFD:BOOL=ON \
            -DHDF5_ENABLE_SZIP_SUPPORT:BOOL=OFF \
            -DHDF5_TEST_VFD:BOOL=ON \
            -DMPIEXEC_MAX_NUMPROCS:STRING=3  \
            ..
          # ctest -D Experimental
          ctest -T Build
          ctest -T Test

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
